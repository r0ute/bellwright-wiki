name: Mirror master

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  mirror:
    if: not contains(github.repository, 'github.io')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to PROD
        run: |
          git push https://x-access-token:${{ secrets.BW_MIRROR_ACCESS }}@github.com/bellwright-wiki/bellwright-wiki.github.io.git HEAD:master
