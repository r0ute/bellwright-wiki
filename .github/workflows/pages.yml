name: Build and Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.BW_ASSETS_ACCESS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate data
        run: python generator/generate.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set dynamic Jekyll baseurl
        run: |
          if grep -q '^baseurl:' docs/_config.yml; then
            sed -i 's|^baseurl:.*|baseurl: "/${{ github.event.repository.name }}"|' docs/_config.yml
          else
            printf '\nbaseurl: "/%s"\n' "${{ github.event.repository.name }}" >> docs/_config.yml
          fi

      - name: Build Jekyll with Pages action
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
